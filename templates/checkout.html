<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - Maa Sharda Enterprises</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .checkout-page {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .checkout-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .checkout-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .checkout-box h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .checkout-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .checkout-total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #ddd;
            font-size: 22px;
            font-weight: bold;
        }

        .place-order-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #28a745;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .place-order-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 700px) {

            .checkout-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">

            <a href="{{ url_for('home') }}">
                Maa Sharda Enterprises
            </a>

        </div>

        <div>

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('products') }}">
                Products
            </a>

            <a href="{{ url_for('cart') }}">
                🛒 Cart
            </a>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        </div>

    </nav>


    <!-- CHECKOUT -->

    <section class="checkout-page">

        <h1 class="checkout-title">
            🛍️ Checkout
        </h1>


        <div class="checkout-grid">


            <!-- CUSTOMER DETAILS -->

            <div class="checkout-box">

                <h2>
                    Customer Details
                </h2>

                <form method="POST">

                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="customer_name"
                            value="{{ user_name }}"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Delivery Address
                        </label>

                        <textarea
                            name="address"
                            placeholder="Enter complete delivery address"
                            required
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="place-order-btn"
                    >
                        Place Order 🎉
                    </button>

                </form>

            </div>


            <!-- ORDER SUMMARY -->

            <div class="checkout-box">

                <h2>
                    Order Summary
                </h2>


                {% for item in cart_items %}

                <div class="checkout-item">

                    <span>

                        {{ item.product.name }}

                        × {{ item.quantity }}

                    </span>

                    <strong>

                        ₹{{ "%.2f"|format(item.subtotal) }}

                    </strong>

                </div>

                {% endfor %}


                <div class="checkout-total">

                    <span>
                        Total
                    </span>

                    <span>
                        ₹{{ "%.2f"|format(total) }}
                    </span>

                </div>

            </div>

        </div>

    </section>

</body>

</html>
